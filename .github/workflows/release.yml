name: Publicar app

# Push a tag like v0.2.0 (matching the version in tauri.conf.json) to build the
# Windows installer, sign the update and publish it. Installed apps update themselves.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test

      - name: Tests de Rust
        run: |
          cargo test --manifest-path crates/stats-core/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BoostBochan ${{ github.ref_name }}"
          releaseBody: "Descarga el instalador `.exe` y ejecútalo. No necesita permisos de administrador ni API key. Las versiones futuras se instalan solas desde la app."
          releaseDraft: false
          prerelease: false
